name: Build Oak & Ember Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify live backend and v0.2.1 UI
        run: |
          grep -q 'ttroukmpyerhtkskpdeg.supabase.co' android/app/src/main/java/com/oakandember/admin/SupabaseConfig.kt
          grep -q 'statusBarsPadding' android/app/src/main/java/com/oakandember/admin/MainActivityV021.kt
          grep -q 'CollapsibleDayHeader' android/app/src/main/java/com/oakandember/admin/MainActivityV021.kt
          if grep -R -q 'Emily Carter\|James Miller\|Sarah Thompson\|Robert Wilson' android/app/src/main/java; then
            echo 'Demo records are still present in native source.'
            exit 1
          fi

      - name: Build native live-data APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OakAndEmber_Admin_Native_Live_v0.2.1.apk

      - name: SHA-256
        run: sha256sum OakAndEmber_Admin_Native_Live_v0.2.1.apk | tee OakAndEmber_Admin_Native_Live_v0.2.1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OakAndEmber_Admin_Native_Live_v0.2.1
          path: |
            OakAndEmber_Admin_Native_Live_v0.2.1.apk
            OakAndEmber_Admin_Native_Live_v0.2.1.sha256
          if-no-files-found: error
          retention-days: 30
