name: Build Oak & Ember Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OakAndEmber_Admin_Native_v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OakAndEmber_Admin_Native_v0.1.0
          path: OakAndEmber_Admin_Native_v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
