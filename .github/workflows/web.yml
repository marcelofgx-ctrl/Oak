name: Verify Oak & Ember Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: oak-and-ember-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
